name: Aigo

options:
  bundleIdPrefix: dev.aigo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

targets:
  Aigo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aigo
      - path: Shared
    dependencies:
      - target: AigoWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aigo.app
        PRODUCT_NAME: Aigo
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Config/Aigo-Info.plist
      properties:
        CFBundleDisplayName: Aigo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Aigo connects to the Aigo host running on your PC over your local network or Tailscale.
        NSCameraUsageDescription: Aigo uses the camera to scan the pairing QR code shown on your PC.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.aigo.app
            CFBundleURLSchemes:
              - aigo

  AigoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AigoWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aigo.app.widgets
        PRODUCT_NAME: AigoWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/AigoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Aigo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Aigo:
    build:
      targets:
        Aigo: all
        AigoWidgets: all
    run:
      config: Debug
    archive:
      config: Release
